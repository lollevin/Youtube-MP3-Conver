<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube to MP3 Converter</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="converter-card">
    <h1><i class="fas fa-music"></i> YouTube to MP3 Converter</h1>

    <div class="input-group">
      <input id="videoUrl" class="input-field" type="text" placeholder="Paste YouTube URL here">
      <button id="pasteBtn" class="paste-btn"><i class="fas fa-paste"></i></button>
    </div>

    <!-- Video Preview Section -->
    <div id="previewContainer">
      <iframe id="videoPreview" frameborder="0" allowfullscreen></iframe>
    </div>

    <div class="quality-group">
      <label for="qualitySelect"><i class="fas fa-file-audio"></i> Audio Quality:</label>
      <select id="qualitySelect" class="input-field">
        <option value="64">64kbps (Low)</option>
        <option value="128" selected>128kbps (Standard)</option>
        <option value="192">192kbps (Good)</option>
        <option value="256">256kbps (High)</option>
        <option value="320">320kbps (Premium)</option>
      </select>
    </div>

    <button id="downloadBtn" class="convert-btn">
      <span class="btn-text">Download MP3</span>
      <span class="btn-icon"><i class="fas fa-download"></i></span>
    </button>

    <div id="status"></div>

    <div id="progressBarContainer">
      <div id="progressBar"></div>
    </div>

    <div id="loadingSpinner"></div>

    <!-- History Section -->
    <div class="history-section">
      <h2><i class="fas fa-history"></i> Download History</h2>
      <ul id="historyList"></ul>
      <button id="clearHistoryBtn" class="clear-btn">
        <i class="fas fa-trash-alt"></i> Clear History
      </button>
    </div>
  </div>

  <div class="wave"></div>

  <script src="script.js"></script>
</body>
</html>
